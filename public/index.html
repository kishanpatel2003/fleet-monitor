<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FLEET MONITOR</h1>
    <p id="activity-mode">Example activity</p>
  </header>

  <div class="fleet-container" id="fleet">
    <svg class="connections" id="connections"></svg>

    <!-- Tier 1: operator -->
    <div class="tier" id="tier-top">
      <div class="agent-card" id="card-operator" data-agent="operator">
        <div class="icon-wrap">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Human silhouette -->
            <circle cx="32" cy="18" r="10" fill="#3B82F6"/>
            <path d="M16 54 C16 40 24 32 32 32 C40 32 48 40 48 54" fill="#3B82F6" stroke="none"/>
          </svg>
        </div>
        <div class="name" style="color:#3B82F6">operator</div>
        <div class="role">human operator</div>
        <div class="status-badge">
          <span class="status-dot active"></span>
          <span class="status-text">active</span>
        </div>
        <div class="duration" data-duration>—</div>
        <div class="last-active" data-last-active>—</div>
      </div>
    </div>

    <div class="tier-gap"></div>

    <!-- Tier 2: coordinator -->
    <div class="tier" id="tier-mid">
      <div class="agent-card" id="card-coordinator" data-agent="coordinator">
        <div class="icon-wrap">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Crown -->
            <polygon points="22,18 26,10 32,16 38,10 42,18" fill="#FFD700" opacity="0.9"/>
            <!-- Bot head -->
            <rect x="18" y="20" width="28" height="22" rx="6" fill="#8B5CF6"/>
            <!-- Eyes -->
            <circle cx="27" cy="30" r="3" fill="#1a1a2e"/>
            <circle cx="37" cy="30" r="3" fill="#1a1a2e"/>
            <!-- Eye shine -->
            <circle cx="28" cy="29" r="1" fill="white" opacity="0.7"/>
            <circle cx="38" cy="29" r="1" fill="white" opacity="0.7"/>
            <!-- Mouth -->
            <rect x="27" y="35" width="10" height="2" rx="1" fill="#1a1a2e"/>
            <!-- Antenna -->
            <line x1="32" y1="20" x2="32" y2="14" stroke="#8B5CF6" stroke-width="2"/>
            <circle cx="32" cy="13" r="2" fill="#8B5CF6"/>
            <!-- Claw arms -->
            <path d="M16 30 L12 28 L10 32 M12 28 L10 25" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
            <path d="M48 30 L52 28 L54 32 M52 28 L54 25" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
            <!-- Body -->
            <rect x="22" y="44" width="20" height="12" rx="4" fill="#8B5CF6" opacity="0.8"/>
            <!-- Feet -->
            <rect x="22" y="55" width="8" height="4" rx="2" fill="#8B5CF6" opacity="0.6"/>
            <rect x="34" y="55" width="8" height="4" rx="2" fill="#8B5CF6" opacity="0.6"/>
          </svg>
        </div>
        <div class="name" style="color:#8B5CF6">coordinator</div>
        <div class="role">orchestrator</div>
        <div class="status-badge">
          <span class="status-dot unknown"></span>
          <span class="status-text">unknown</span>
        </div>
        <div class="duration" data-duration>—</div>
        <div class="last-active" data-last-active>—</div>
      </div>
    </div>

    <div class="tier-gap"></div>

    <!-- Tier 3: Researcher + builder -->
    <div class="tier" id="tier-bottom">
      <div class="agent-card" id="card-researcher" data-agent="researcher">
        <div class="icon-wrap">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Bot head -->
            <rect x="18" y="16" width="28" height="22" rx="6" fill="#10B981"/>
            <!-- Eyes -->
            <circle cx="27" cy="26" r="3" fill="#1a1a2e"/>
            <circle cx="37" cy="26" r="3" fill="#1a1a2e"/>
            <!-- Eye shine -->
            <circle cx="28" cy="25" r="1" fill="white" opacity="0.7"/>
            <circle cx="38" cy="25" r="1" fill="white" opacity="0.7"/>
            <!-- Mouth -->
            <path d="M27 32 Q32 36 37 32" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <!-- Antenna -->
            <line x1="32" y1="16" x2="32" y2="10" stroke="#10B981" stroke-width="2"/>
            <circle cx="32" cy="9" r="2" fill="#10B981"/>
            <!-- Claw arms -->
            <path d="M16 26 L12 24 L10 28 M12 24 L10 21" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
            <path d="M48 26 L52 24 L54 28 M52 24 L54 21" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
            <!-- Magnifying glass -->
            <circle cx="50" cy="12" r="6" stroke="#10B981" stroke-width="2" fill="none" opacity="0.8"/>
            <line x1="54.5" y1="16.5" x2="58" y2="20" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
            <!-- Body -->
            <rect x="22" y="40" width="20" height="12" rx="4" fill="#10B981" opacity="0.8"/>
            <!-- Feet -->
            <rect x="22" y="51" width="8" height="4" rx="2" fill="#10B981" opacity="0.6"/>
            <rect x="34" y="51" width="8" height="4" rx="2" fill="#10B981" opacity="0.6"/>
          </svg>
        </div>
        <div class="name" style="color:#10B981">researcher</div>
        <div class="role">research agent</div>
        <div class="status-badge">
          <span class="status-dot unknown"></span>
          <span class="status-text">unknown</span>
        </div>
        <div class="duration" data-duration>—</div>
        <div class="last-active" data-last-active>—</div>
      </div>

      <div class="agent-card" id="card-builder" data-agent="builder">
        <div class="icon-wrap">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Bot head -->
            <rect x="18" y="16" width="28" height="22" rx="6" fill="#F59E0B"/>
            <!-- Eyes -->
            <circle cx="27" cy="26" r="3" fill="#1a1a2e"/>
            <circle cx="37" cy="26" r="3" fill="#1a1a2e"/>
            <!-- Eye shine -->
            <circle cx="28" cy="25" r="1" fill="white" opacity="0.7"/>
            <circle cx="38" cy="25" r="1" fill="white" opacity="0.7"/>
            <!-- Mouth -->
            <path d="M27 32 Q32 36 37 32" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <!-- Antenna -->
            <line x1="32" y1="16" x2="32" y2="10" stroke="#F59E0B" stroke-width="2"/>
            <circle cx="32" cy="9" r="2" fill="#F59E0B"/>
            <!-- Claw arms -->
            <path d="M16 26 L12 24 L10 28 M12 24 L10 21" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
            <path d="M48 26 L52 24 L54 28 M52 24 L54 21" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
            <!-- Wrench -->
            <path d="M8 8 L14 14 M6 12 C4 10 4 6 8 4 C10 6 10 10 8 12 Z" stroke="#F59E0B" stroke-width="1.5" fill="#F59E0B" opacity="0.8"/>
            <!-- Body -->
            <rect x="22" y="40" width="20" height="12" rx="4" fill="#F59E0B" opacity="0.8"/>
            <!-- Feet -->
            <rect x="22" y="51" width="8" height="4" rx="2" fill="#F59E0B" opacity="0.6"/>
            <rect x="34" y="51" width="8" height="4" rx="2" fill="#F59E0B" opacity="0.6"/>
          </svg>
        </div>
        <div class="name" style="color:#F59E0B">builder</div>
        <div class="role">coding agent</div>
        <div class="status-badge">
          <span class="status-dot unknown"></span>
          <span class="status-text">unknown</span>
        </div>
        <div class="duration" data-duration>—</div>
        <div class="last-active" data-last-active>—</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span class="refresh-indicator" id="refresh-dot"></span>
    polling every 5s
  </div>

  <script src="app.js"></script>
</body>
</html>
